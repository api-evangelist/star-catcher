name: Star Catcher
description: >-
  Star Catcher is a space technology company building the first power grid in
  space. Its optical power beaming system, the Star Catcher Network, concentrates
  and transmits solar energy directly to satellites' existing solar arrays,
  delivering up to 10x more power without any hardware modifications. Founded in
  2024 and backed by Initialized Capital, the company holds a world record for
  optical power beaming and is working to bring shared orbital power
  infrastructure to satellites supporting universal connectivity, advanced
  computing, and national security. Star Catcher raised $65 million in May 2026
  and plans to bring its technology to orbit. Star Catcher operates physical
  space hardware and does not currently publish a public developer API.
